# 릴리스 빌드 - 태그 하나로 세 플랫폼을 한꺼번에.
#
#   git tag v1.0.5 && git push origin v1.0.5
#
# 이렇게 태그를 올리면 Windows 설치 파일 · Android APK · 우분투 서버 설치 파일을
# 각자 맞는 러너에서 빌드하고, GitHub Release 에 한데 모아 붙인다.
#
# 왜 CI 인가: Flutter 의 Windows 빌드는 Windows 에서만 되고(MSVC 필요), 개발 PC 는
# 우분투다. 사람이 Windows PC 를 켜서 빌드하는 단계를 없애지 않으면 "세 플랫폼을
# 항상 같은 버전으로" 라는 배포 방침이 손에 달려 있게 된다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0.5). 태그 없이 손으로 돌릴 때만."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"
  # 설치 프로그램이 기본값으로 보여 주는 서버 주소. 설치 중 바꿀 수 있다.
  DEFAULT_SERVER_URL: "http://192.168.0.20:8000"

jobs:
  # ------------------------------------------------------------ 버전 결정
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "잘못된 버전 형식"; exit 1; }
          python3 installer/check_version.py "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "릴리스 버전: $v"

  # ------------------------------------------------------------ 검사
  # 빌드 전에 백엔드 스모크 테스트와 Flutter 테스트를 통과해야 한다.
  # 깨진 채로 세 플랫폼에 나가는 것이 가장 비싼 실패다.
  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ddeck_test
          POSTGRES_USER: ddeck
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ddeck -d ddeck_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://ddeck:ci-disposable-password@localhost:5432/ddeck_test
        run: |
          pip install -r requirements-dev.txt
          python scripts/test_postgres.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 백엔드 스모크 테스트
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check app scripts ../deploy
          python scripts/test_migrations.py
          python scripts/test_service_work_types.py
          python scripts/test_quotations.py
          python scripts/test_drive_backup.py
          python scripts/test_local_admin.py
          python scripts/test_store_contacts.py
          python scripts/smoke_test.py
          python scripts/smoke_test_legacy.py
          python scripts/smoke_test_review.py
          python scripts/smoke_test_priority2.py
          python scripts/smoke_test_priority345.py
          python scripts/test_ui_review.py
          python scripts/test_client_updates.py
          python scripts/test_legacy_history.py
          python ../deploy/test_backup_bundle.py
          python ../deploy/test_sqlite_backup.py
          python ../deploy/test_update.py
          python ../deploy/test_operations.py
          python ../deploy/test_register_systemd.py
          python ../deploy/test_restart_with_backup.py
          python -m unittest discover -s ../deploy -p test_prepare_legacy_sqlite.py
          bash -n ../deploy/install.sh ../deploy/update.sh ../deploy/backup.sh ../deploy/restart-with-backup.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter 테스트
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # ------------------------------------------------------------ Windows
  windows:
    needs: [meta, test, postgres-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 PowerShell 구문 검사 및 SQLite 복원 검사
        shell: pwsh
        run: |
          Get-ChildItem deploy/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          python deploy/test_sqlite_backup.py
          if ($LASTEXITCODE -ne 0) { throw 'SQLite 복원 검사 실패' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # windows-latest 러너에는 Inno Setup 6 이 들어 있다. build.ps1 이
      # 표준 경로에서 찾는다. 없으면 스크립트가 설치 안내와 함께 멈춘다.
      - name: 설치 파일 빌드
        shell: pwsh
        run: |
          .\installer\build.ps1 -ServerUrl "${{ env.DEFAULT_SERVER_URL }}" -Version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ddeck-setup-*.exe
          if-no-files-found: error

  # ------------------------------------------------------------ Android
  android:
    needs: [meta, test, postgres-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle 8.14 / AGP 8.11 조합은 Java 17~21 을 요구한다. 25 는 안 된다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Android 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64를 설정하세요: docs/ANDROID_SIGNING.md"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ddeck-release.jks"
      - name: APK 빌드 (arm64)
        env:
          DDECK_KEYSTORE_PATH: ${{ runner.temp }}/ddeck-release.jks
          DDECK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DDECK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DDECK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist/ddeck-${{ needs.meta.outputs.version }}-arm64.apk"
      - name: APK 서명 확인
        run: |
          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --verbose --print-certs dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/ddeck-*-arm64.apk
          if-no-files-found: error

  # ------------------------------------------------------------ 서버 (우분투)
  server:
    needs: [meta, test, postgres-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 서버 설치 파일 빌드
        run: python installer/build_server_package.py --version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/ddeck-server-*.run
          if-no-files-found: error

  # ------------------------------------------------------------ 릴리스로 묶기
  publish:
    needs: [meta, windows, android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 클라이언트 업데이트 정보 서명
        env:
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          pip install cryptography==50.0.1
          python installer/build_update_manifest.py --directory out --version "${{ needs.meta.outputs.version }}"
      - name: 산출물 확인
        run: |
          cp docs/사용자-가이드.pdf "out/ddeck-user-guide-${{ needs.meta.outputs.version }}.pdf"
          cp docs/서버-운영-매뉴얼.pdf "out/ddeck-server-manual-${{ needs.meta.outputs.version }}.pdf"
          cd out
          sha256sum *.exe *.apk *.run *.pdf update-manifest.json > SHA256SUMS
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            out/SHA256SUMS
            out/update-manifest.json
      # 릴리스 노트는 docs/releases/<버전>.md 에 쓴다 (dist/ 는 gitignore 라
      # 체크아웃에 없다). 파일이 없으면 기본 한 줄로 대신한다 - 노트가 없다고
      # 릴리스가 실패하면 안 된다.
      - name: 릴리스 노트 준비
        shell: bash
        run: |
          v="${{ needs.meta.outputs.version }}"
          if [ -f "docs/releases/$v.md" ]; then
            cp "docs/releases/$v.md" out/NOTES.md
          else
            printf 'd-ddeck %s\n\n릴리스 노트 없음. 변경 내역은 커밋 기록을 참고.\n' "$v" > out/NOTES.md
          fi
      # 태그로 시작된 실행만 Release 를 만든다. 손으로 돌린(workflow_dispatch)
      # 빌드는 아티팩트로만 남겨 시험용으로 쓴다.
      - name: GitHub Release 생성
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: d-ddeck ${{ needs.meta.outputs.version }}
          body_path: out/NOTES.md
          files: |
            out/ddeck-setup-*.exe
            out/ddeck-*-arm64.apk
            out/ddeck-server-*.run
            out/ddeck-user-guide-*.pdf
            out/ddeck-server-manual-*.pdf
            out/SHA256SUMS
            out/update-manifest.json
